  .muted { fill: #898781; }
  .grid { stroke: #e1e0d9; stroke-width: 1; }
  .axis { stroke: #c3c2b7; stroke-width: 1; }
  .thr { stroke: #52514e; stroke-width: 1.5; }
  .zone { fill: #f0efec; }
  .s1 { fill: #2a78d6; }
  .s2 { fill: #eb6834; }
  .ring { stroke: #fcfcfb; stroke-width: 1.5; }
  text { font-family: system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19; }
    .ink { fill: #ffffff; }
    .ink2 { fill: #c3c2b7; }
    .grid { stroke: #2c2c2a; }
