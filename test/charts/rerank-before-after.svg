<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" width="960" height="570" role="img" aria-labelledby="t2 d2">
<title id="t2">Vector search alone vs reranked: ranking and threshold results</title>
<desc id="d2">Share of test questions per check. Ranking: answer first in All uploads 33 of 43 vs 40 of 43; in one upload 36 vs 40 of 43; expected upload first 48 vs 50 of 50. Threshold: answerable questions sent on to the LLM 50 of 50 both; stopped before the LLM: wrong upload 38 vs 50 of 50, near-miss 0 vs 10 of 12, off-topic 3 vs 9 of 9, several uploads without the answer 0 vs 4 of 4.</desc>

